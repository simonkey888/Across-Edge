[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="across-edge"
version="0.4.0"
description="Zero-spend Across relayer research plus isolated read-only ATM Web3 worker"
requires-python=">=3.11"
license={text="MIT"}
[project.scripts]
across-edge="across_edge.cli:main"
across-edge-worker="across_edge.atm_worker_cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
addopts="-q"
