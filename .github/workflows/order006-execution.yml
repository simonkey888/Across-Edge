name: order-006-execution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact audited HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record execution identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/ORDER006_FINAL
          {
            echo "HEAD_SHA=$(git rev-parse HEAD)"
            echo "BRANCH=${GITHUB_REF_NAME}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "TIMESTAMP_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "OS=$(uname -s)"
            echo "ARCH=$(uname -m)"
            echo "PYTHON_VERSION=$(python3 --version 2>&1)"
            echo "NODE_VERSION=$(node --version 2>&1)"
          } | tee evidence/ORDER006_FINAL/execution_identity.txt

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-deps -e . pytest

      - name: Full pytest suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q --junitxml=evidence/ORDER006_FINAL/pytest.xml

      - name: Compileall
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q src scripts
          echo "COMPILEALL=PASS" | tee evidence/ORDER006_FINAL/compileall.txt

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/secret_scan.py | tee evidence/ORDER006_FINAL/secret_scan.txt

      - name: Safety check
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m across_edge.cli safety-check | tee evidence/ORDER006_FINAL/safety_check.txt

      - name: Verify pinned upstream and patch
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(python3 -c 'import json; print(json.load(open("config/upstream-pin.json"))["sha"])')
          PATCH_SHA=$(python3 -c 'import json; print(json.load(open("config/upstream-pin.json"))["instrumentation_patch_sha256"])')
          ACTUAL_PATCH_SHA=$(sha256sum patches/across-relayer-order003-instrumentation.patch | awk '{print $1}')
          test "$PIN" = "741ca9f7d72923f7b13c1c2462ca90eba81e1a87"
          test "$PATCH_SHA" = "$ACTUAL_PATCH_SHA"
          git clone --filter=blob:none https://github.com/across-protocol/relayer.git upstream-relayer
          git -C upstream-relayer fetch --depth 1 origin "$PIN"
          git -C upstream-relayer checkout --detach "$PIN"
          test "$(git -C upstream-relayer rev-parse HEAD)" = "$PIN"
          git apply --check patches/across-relayer-order003-instrumentation.patch
          git apply patches/across-relayer-order003-instrumentation.patch
          echo "UPSTREAM_PIN=$PIN" | tee evidence/ORDER006_FINAL/upstream.txt
          echo "PATCH_SHA256=$ACTUAL_PATCH_SHA" | tee -a evidence/ORDER006_FINAL/upstream.txt
          echo "PATCH_APPLY=PASS" | tee -a evidence/ORDER006_FINAL/upstream.txt
          echo "UPSTREAM_HEAD=$(git -C upstream-relayer rev-parse HEAD)" | tee -a evidence/ORDER006_FINAL/upstream.txt

      - name: Upstream dependency install
        working-directory: upstream-relayer
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable

      - name: Read-only public network smoke
        shell: bash
        run: |
          set -u
          python3 - <<'PY' | tee evidence/ORDER006_FINAL/network_smoke.txt
          import json, ssl, time, urllib.request
          targets = {
              'ARBITRUM_RPC':'https://arb1.arbitrum.io/rpc',
              'BASE_RPC':'https://mainnet.base.org',
          }
          for name, url in targets.items():
              rec={'target':name,'url':url}
              try:
                  req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_chainId','params':[]}).encode(),headers={'Content-Type':'application/json'})
                  t=time.monotonic()
                  with urllib.request.urlopen(req,timeout=15,context=ssl.create_default_context()) as r:
                      body=r.read().decode(errors='replace')
                      rec.update(http_status=r.status,latency_ms=round((time.monotonic()-t)*1000,3),result=json.loads(body).get('result'))
              except Exception as e:
                  rec.update(error=f'{type(e).__name__}: {e}')
              print(json.dumps(rec,sort_keys=True))
          PY

      - name: Two-minute zero-write shadow run
        shell: bash
        run: |
          set -u
          mkdir -p evidence/ORDER006_FINAL/shadow
          timeout 150s python3 scripts/shadow_run.py ./upstream-relayer \
            --duration 120 \
            --polling-delay 5 \
            --observer-interval 2 \
            --export-interval 30 \
            --db evidence/ORDER006_FINAL/shadow.sqlite \
            --run-id order006-shadow \
            --out evidence/ORDER006_FINAL/shadow > evidence/ORDER006_FINAL/shadow/stdout.txt 2>&1
          rc=$?
          echo "SHADOW_EXIT_CODE=$rc" | tee evidence/ORDER006_FINAL/shadow/status.txt
          exit $rc

      - name: Final manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SOURCE_HEAD_SHA=$(git rev-parse HEAD)"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "AUTHORIZED_SPEND_USD=0"
            echo "PRIVATE_KEYS_USED=0"
            echo "TRANSACTIONS_BROADCAST=0"
            echo "ONCHAIN_VALUE_TRANSFER=0"
            echo "LIVE_FINANCIAL_EXECUTION=0"
          } > evidence/ORDER006_FINAL/final_manifest.txt

      - name: Upload fresh ORDER-006 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order006-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/ORDER006_FINAL/
          if-no-files-found: warn
          retention-days: 7
