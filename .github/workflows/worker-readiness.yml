name: ATM Worker Readiness
on:
  push:
    branches: ["worker/**"]
  pull_request:
    branches: [order-001-shadow-relayer]
    paths: ["src/across_edge_worker/**","tests/**","scripts/**","docs/ATM_WORKER_MODE.md","evidence/ATM-WORKER-READY-R1/**","pyproject.toml","README.md",".github/workflows/worker-readiness.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atm-worker-ready-${{ github.ref }}
  cancel-in-progress: true
env:
  FROZEN_RELAYER_HEAD: 8a70960d838880c9735fcfb405b04bca0b4f4061
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Exact head and dual-track ancestry
        run: |
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "EVENT_GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$FROZEN_RELAYER_HEAD" "$CANDIDATE_SHA"
      - name: Install local package and test runner
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pip check
      - name: Full exact-head regressions
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/full-pytest.txt
          python -m compileall -q src scripts tests
          echo COMPILEALL=PASS > /tmp/compileall.txt
          python scripts/secret_scan.py | tee /tmp/project-secret-scan.txt
          PYTHONPATH=src python -m across_edge.cli safety-check | tee /tmp/project-safety.txt
          python scripts/worker_secret_scan.py | tee /tmp/worker-secret-scan.txt
      - name: Fresh exact-head worker evidence
        env: {PYTHONPATH: "src:tests"}
        run: |
          python scripts/generate_worker_evidence.py --source-sha "$CANDIDATE_SHA" --pr2-head "$FROZEN_RELAYER_HEAD" --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cp /tmp/full-pytest.txt evidence/ATM-WORKER-READY-R1/CI_FULL_PYTEST.txt
          cp /tmp/compileall.txt evidence/ATM-WORKER-READY-R1/CI_COMPILEALL.txt
          cp /tmp/project-secret-scan.txt evidence/ATM-WORKER-READY-R1/CI_PROJECT_SECRET_SCAN.txt
          cp /tmp/project-safety.txt evidence/ATM-WORKER-READY-R1/CI_PROJECT_SAFETY.txt
          cp /tmp/worker-secret-scan.txt evidence/ATM-WORKER-READY-R1/CI_WORKER_SECRET_SCAN.txt
          python scripts/finalize_worker_evidence.py --source-sha "$CANDIDATE_SHA" --pr2-head "$FROZEN_RELAYER_HEAD" --run-id "$GITHUB_RUN_ID"
          python scripts/verify_worker_evidence.py
      - name: Upload exact-head worker evidence
        uses: actions/upload-artifact@v4
        with:
          name: atm-worker-ready-r1-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: evidence/ATM-WORKER-READY-R1/
          retention-days: 30
          if-no-files-found: error
  rpc-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Exact-head read-only RPC qualification
        env: {PYTHONPATH: src}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python - <<'PY'
          from across_edge_worker.rpc import ReadOnlyRpcClient
          cases=[("https://arbitrum-one-rpc.publicnode.com",42161),("https://base-rpc.publicnode.com",8453)];allowed=tuple(x[0] for x in cases);chains=tuple(x[1] for x in cases)
          for url,chain in cases:
              e=ReadOnlyRpcClient(url,allowed,chains).provenance();assert e.chain_id==chain;assert e.block_number>0;assert len(e.block_hash)==66;print(f"RPC_READ_ONLY_PASS chain={chain} block={e.block_number} hash={e.block_hash}")
          PY
